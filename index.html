<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#312e81">
  <title>Acute Neurology Reasoning</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="app-header">
    <div class="header-inner">
      <button class="icon-btn" id="homeBtn" aria-label="Home">⌂</button>
      <div class="brand-block">
        <div class="brand">Acute Neurology Reasoning</div>
        
      </div>
      <div class="header-meta">
        <span id="caseLabel">Home</span>
      </div>
    </div>
  </header>

  <main id="app" class="app-shell"></main>

  <nav id="mobileActions" class="mobile-actions" hidden aria-hidden="true"></nav>


  <dialog id="sheet" class="sheet">
    <div class="sheet-grabber" aria-hidden="true"></div>
    <div class="sheet-head">
      <div>
        <div class="eyebrow" id="sheetEyebrow"></div>
        <h2 id="sheetTitle"></h2>
      </div>
      <button class="icon-btn close-btn" id="closeSheet" aria-label="Close">×</button>
    </div>
    <div id="sheetBody" class="sheet-body"></div>
  </dialog>

  <script src="cases.js"></script>
  <script src="app.js"></script>
</body>
</html>
